data:
  - namespace: "bebas-openshift-vault"
    deploymentconfigs:
      - name: "pikachu-dc"
        containers:
          - name: "pikachu"
            secrets:
              - "pikachu-secret"
            configmap:
              - "config-pikachu"
            env:
              - "APP_MODE"
    deployments:
      - name: "gengar-api"
        containers:
          - name: "gengar"
            secrets:
              - "gengar-secret"
            configmap:
              - "config-gengar"
            env:
              - "APP_MODE"
